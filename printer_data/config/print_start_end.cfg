# NAZUNSPE X2 - Start / Ende
# Fuer PrusaSlicer am besten START_PRINT BED=... T0=... aufrufen.
# T0/T1-Druck mit zwei Materialien braucht spaeter einen gesonderten Startablauf.

[gcode_macro START_PRINT]
description: T0 single-material print; bed first, hotend from bed target minus 5 C
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set nozzle = params.T0|default(210)|float %}
    CLEAR_PAUSE
    M107
    M140 S{bed}
    HOME_IF_NOT
    T0
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 5}
    M104 T0 S{nozzle}
    M190 S{bed}
    M109 T0 S{nozzle}
    G90
    M83
    G92 E0
    G1 Z5 F600
    RESPOND MSG="NAZUNSPE X2 T0 print ready"

[gcode_macro END_PRINT]
description: Stop heaters and Berd-Air after print; no unsafe parking move
gcode:
    M107
    TURN_OFF_HEATERS
    {% if 'xyz' in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=idex_end
        G91
        G1 Z5 F600
        RESTORE_GCODE_STATE NAME=idex_end
    {% endif %}
    M84
    RESPOND MSG="NAZUNSPE X2 print complete"
