[pause_resume]
recover_velocity: 50

[display_status]

[gcode_arcs]
resolution: 0.01

[force_move] 
enable_force_move: true

[save_variables]
filename: ~/printer_data/config/variables.cfg

[respond]
default_type: echo

[exclude_object]

[idle_timeout] 
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
        M118 Timeout Reached
        M117 Timeout Reached
        TURN_OFF_HEATERS
        M84
    {% endif %}