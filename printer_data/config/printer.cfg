[include mcu_ebb.cfg]
[include mcu_ebb1.cfg]
[include mainsail.cfg]
[include motor.cfg]
#[include homing_override.cfg]
[include safe_z_home.cfg]
[include verifyheaters.cfg]
[include macros.cfg]
[include misc.cfg]
#[include fila_runout_motion_sensor.cfg]
# Klipper backup

########################################
#  Machine Settings
########################################
[printer]
kinematics: cartesian
max_velocity: 800
max_accel: 2500
max_z_velocity: 10
max_z_accel: 25

[mcu]
canbus_uuid=fe9ab140b95d

[mcu host]
serial: /tmp/klipper_host_mcu






########################################
#  Bed Settings
########################################
[heater_bed]
heater_pin: PF5		#BED-OUT
sensor_type: EPCOS 100K B57560G104F 
sensor_pin: PB1 				
min_temp: 0
max_temp: 110
max_power: 1.0
smooth_time: 2.5
#control: pid
#pid_kp = 73.129
#pid_ki = 0.788
#pid_kd = 1697.497

[bed_screws]
screw1: 35,35
screw1_name: front
screw2: 35,275
screw2_name: rear left
screw3: 275,275
screw3_name: rear right
screw4:	275,35


########################################
#  Stepper motors configuration
########################################
# ===================== X-LEFT/E1 IDEX CARRIAGE & EXTRUDER/ #Motor1 ====================
[stepper_x]		
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 64
rotation_distance: 40
#full_steps_per_rotation: 200
endstop_pin: ^!PF4			
position_endstop: -54
position_max: 305
position_min: -55
homing_speed: 20
homing_positive_dir: false

# ===================== X-RIGHT/E2 IDEX CARRIAGE & EXTRUDER/ #Motor5 ====================
# X1 = [stepper_x]; X2 = [dual_carriage] with "axis: x"
[dual_carriage]		
axis: x 
safe_distance: 70
step_pin: PG13
dir_pin: PG12				
enable_pin: !PG15
microsteps: 64
rotation_distance: 40
#full_steps_per_rotation: 200
endstop_pin: ^!PF0				
position_endstop: 354	#359.35
position_min: -5		#0
position_max: 355		#360
homing_speed: 20

# ===================== Y-AXIS CONFIG/ #Motor2 =====================
[stepper_y]		
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 64
rotation_distance: 40
#full_steps_per_rotation: 200
endstop_pin: ^!PF3				
position_endstop: 0
position_min: 0
position_max: 310
homing_speed: 20

# ===================== Z-AXIS CONFIG/ #Motor3 =====================
[stepper_z]		
step_pin: PB8
dir_pin: !PB7				
enable_pin: !PE0
microsteps: 64
rotation_distance: 4
#full_steps_per_rotation: 200
position_max: 350 
position_min: -9.0 
# =========== Z-AXIS CONFIG/ENDSTOP-SWITCH ===========
# Comment out when using a BD sensor
#endstop_pin: ^!PF2                                            
#homing_speed: 5		
#second_homing_speed: 3	
#homing_retract_speed: 2
#homing_retract_dist:5
# ===================== Z-AXIS CONFIG/BD-SENSOR =====================
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.5
homing_speed: 5
second_homing_speed: 3  #set this to 3 if homing with collision
homing_retract_speed: 2
homing_retract_dist:5

# ===================== Z1-AXIS CONFIG/ #Motor4 =====================
[stepper_z1]		
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 64
rotation_distance: 4
#full_steps_per_rotation: 200
# =========== Z-AXIS CONFIG/ENDSTOP-SWITCH ===========
# Comment out when using a BD sensor
#endstop_pin: ^!PF1 
# =========== Z-AXIS CONFIG/BD-SENSOR ===========
# Comment out when using a Endstop-Switch
#endstop_pin: probe:z_virtual_endstop


########################################
# TMC2240 configuration
########################################
[tmc2240 stepper_x]
cs_pin: PC13
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true	
rref: 12000
driver_SLOPE_CONTROL: 2

[tmc2240 dual_carriage]
cs_pin: PG14
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true
rref: 12000
driver_SLOPE_CONTROL: 2

[tmc2240 stepper_y]
cs_pin: PE3
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true	
rref: 12000
driver_SLOPE_CONTROL: 2

[tmc2240 stepper_z]
cs_pin: PB9
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true	
rref: 12000

[tmc2240 stepper_z1]
cs_pin: PB5
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true
rref: 12000

# ===================== Bed Distance Sensor =====================
[BDsensor] 
# Don't use aliases for the board pins
sda_pin: ebb:PA10   # Beispiel-Pins deines EBB42 Gen2
scl_pin: ebb:PA9
delay: 10 # you can set it 10 if the BDsensor version is >=1.2
#z_offset:0 #  within -0.6 to 0.6mm
x_offset: 25
y_offset: 0
no_stop_probe: # fast probe that the toolhead will not stop at the probe point,disable it by commenting out.
position_endstop: 1.2 #the triggered position, recommend value is 1~2.8
collision_homing:0 #  set it 1 to enable homing with nozzle collision sensing.
collision_calibrate:0 # set it 1 to enable auto calibrate BDsensor with nozzle collision sensing.
#QGL_Tilt_Probe:0 # set 1 to enable probe up and down when do quad_gantry_level,default is 1
speed:3 # this speed only works for the z tilt and PROBE_ACCURACY command.
homing_cmd: G28 # needed by the auto calibration.the default is G28, please set it G990028 if there has [gcode_macro G28]

# ===================== Bed Distance Sensor && z_tilt =====================
[z_tilt]
z_positions:
    -40, 155
    350, 155
points:
    35, 155           # Sensor bei X=35 -> Düse steht sicher auf dem Bett bei X=10
    280, 155          # Sensor bei X=280 -> Düse steht bei X=255 (29 mm Abstand zum geparkten T1)
speed: 100
horizontal_move_z: 6
retries: 5
retry_tolerance: 0.02

# ===================== Bed Distance Sensor && bed_mesh =====================
[bed_mesh]
speed: 150
horizontal_move_z: 1.5
mesh_min: 35, 15             # Sensor bei X=35 -> Düse bei X=10 (10 mm Sicherheitsabstand zum linken Bettrand)
mesh_max: 295, 295           # Sensor bei X=295 -> Düse bei X=270 (14 mm Sicherheitsabstand zum geparkten T1)
probe_count: 10, 10
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
zero_reference_position: 155, 155


# =========== Z-AXIS CONFIG/endstop_phase stepper_z ===========
# Comment out when using a BD sensor
#[endstop_phase stepper_z]


########################################
# EXTRUDER configuration
########################################
# ===================== HGX lite Extruder/ T0 (EBB42 Gen2) =====================
[extruder]
step_pin: ebb:PD3
dir_pin: ebb:PD2
enable_pin: !ebb:PB6
microsteps: 16
gear_ratio: 9.54647:1
rotation_distance: 52.32
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb:PB0
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: ebb:PA1
#control: pid
#pid_Kp: 34.809
#pid_Ki: 12.893
#pid_Kd: 23.496
min_temp: 0
max_temp: 300
min_extrude_temp: 190

# ===================== HGX lite Extruder/ T1 (EBB42 Gen2) =====================
[extruder1]
step_pin: ebb1:PD3
dir_pin: ebb1:PD2
enable_pin: !ebb1:PB6
microsteps: 16
gear_ratio: 9.54647:1
rotation_distance: 52.32
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb1:PB0
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: ebb1:PA1
#control: pid
#pid_Kp=32.893
#pid_Ki=11.542
#pid_Kd=23.436
min_temp: 0
max_temp: 300
min_extrude_temp: 190


########################################
# Temperatur Sensors
########################################
[temperature_sensor manta]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor raspi]
sensor_type: temperature_host

[temperature_sensor x_motor]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PB0
min_temp: 0
max_temp: 100

[temperature_sensor x1_motor]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC5
min_temp: 0
max_temp: 100


########################################
# FAN configuration
########################################
[temperature_fan stepper_cooling_fan]
pin: PF7                      
sensor_type: ATC Semitec 104GT-2 
sensor_pin: PC4              
control: pid                  
pid_Kp: 40                    
pid_Ki: 0.2
pid_Kd: 20
min_temp: 0
max_temp: 90                  
target_temp: 45.0             
max_speed: 1.0                
min_speed: 0.0                
off_below: 0.10               

[controller_fan stepper_fan]
pin: PA0
max_power: 1.0
idle_timeout: 180
idle_speed: 0.6
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, dual_carriage

# ===================== Part COOLING T0 ====================
#cycle_time  0.002 [500 Hz], 0.0005 [2 kHz] 0.0001 [10 kHz] 
#ZR5551PM (555er-Motor-Membranpumpe) bei 1–2 kHz am geschmeidigsten und leisesten, ohne an Drehmoment zu verlieren.
[fan_generic berd_air_t0]
pin: PF6	
cycle_time: 0.002      # Testwert für 25 kHz (bei Regelproblemen auf z. B. 0.008 erhöhen)
hardware_pwm: false       # Falls dein gewählter Pin am Manta M8P Hardware-PWM unterstützt
off_below: 0.05          # Verhindert Brummen unterhalb der Anlaufspannung

# ===================== Part COOLING T1 ====================
[fan_generic berd_air_t1]
pin: PA4
hardware_pwm: False
cycle_time: 0.002      # Testwert für 25 kHz (bei Regelproblemen auf z. B. 0.008 erhöhen)
hardware_pwm: false       # Falls dein gewählter Pin am Manta M8P Hardware-PWM unterstützt
off_below: 0.05          # Verhindert Brummen unterhalb der Anlaufspannung

# ===================== 4 wire Fan ====================
[fan_generic cm4_fan]
pin: PA6        
max_power: 1.0
shutdown_speed: 1.0
cycle_time: 0.00004
hardware_pwm: true
off_below: 0.15
kick_start_time: 0.5
tachometer_pin: PC2     # Der Tacho-Eingangspin am FIL-Port (mit Pull-Up ^ e.G. ^ebb1:PA3)
tachometer_poll_interval: 0.0005
tachometer_ppr: 2
#enable_pin: ebb1:PB4 #   Optional pin to enable power to the fan. This can be useful for fans
#   with dedicated PWM inputs. Some of these fans stay on even at 0% PWM
#   input. In such a case, the PWM pin can be used normally, and e.g. a
#   ground-switched FET(standard fan pin) can be used to control power to
#   the fan.
# Sensor & Temperatur-Steuerung
#sensor_type: temperature_host # Liest die CPU-Temperatur des CM4 aus
#min_temp: 10
#max_temp: 85                # Not-Aus-Schwellenwert zum Schutz des CM4
#target_temp: 50.0           # Zieltemperatur (ab hier regelt der Lüfter hoch)
#max_speed: 0.9
#min_speed: 0.15              # Ermöglicht, dass der Lüfter komplett stoppt
#control: pid                # PID-Regelung für sanfte Drehzahlanpassungen
#pid_kp: 1.0
#pid_ki: 0.5
#pid_kd: 2.0


############################################################
### BOARD PINs
############################################################
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

############################################################
### PSU PIN BIGTREETECH RELAY V1.2
############################################################
[output_pin psu_shutdown]
pin: PD14
value: 1
shutdown_value: 0


############################################################
### LED configuration
############################################################
# ===================== Case LED =====================
[output_pin case_light]
pin: PA5
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.01

# ===================== NeoPixel LED =====================
#[neopixel stripe]
#pin: PD15
#   The pin connected to the neopixel. This parameter must be
#   provided.
#chain_count: 5
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
#color_order: GRBW
#   Set the pixel order required by the LED hardware (using a string
#   containing the letters R, G, B, W with W optional). Alternatively,
#   this may be a comma separated list of pixel orders - one for each
#   LED in the chain. The default is GRB.
#initial_RED: 0.25
#initial_GREEN: 0.25
#initial_BLUE: 0.25
#initial_WHITE: 0.25
#   See the "led" section for information on these parameters.
#[led_effect panel_idle]
#autostart:              true
#frame_rate:             24
#leds:
#    neopixel:panel_ring
#layers:
#    breathing  10 1 top (.5,.5,1)


[include autotune_tmc.cfg]

[include shell_command.cfg]

