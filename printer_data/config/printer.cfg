[include mcu_ebb.cfg]
[include mcu_ebb1.cfg]
[include mainsail.cfg]
[include motor.cfg]
#[include macros_dual_extruder.cfg]
[include macros.cfg]
# Klipper backup

########################################
#  Machine Settings
########################################
[printer]
kinematics: cartesian
max_velocity: 800
max_accel: 2500
max_z_velocity: 10
max_z_accel: 25

[mcu]
canbus_uuid=fe9ab140b95d

[mcu host]
serial: /tmp/klipper_host_mcu

[pause_resume]
recover_velocity: 50

[display_status]

[gcode_arcs]
resolution: 0.01

[force_move] 
enable_force_move: true

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[respond]
default_type: echo

[idle_timeout] 
timeout: 7200
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
        M118 Timeout Reached
        M117 Timeout Reached
        TURN_OFF_HEATERS
        M84
    {% endif %}


########################################
#  Bed Settings
########################################
[heater_bed]
heater_pin: PF5		#BED-OUT
sensor_type: EPCOS 100K B57560G104F 
sensor_pin: PB1 				
min_temp: 1
max_temp: 110
max_power: 1.0
smooth_time: 2.5
#control: pid
#pid_Kp: 50.0          
#pid_Ki: 2.0
#pid_Kd: 300.0

[bed_screws]
screw1: 35,35
screw1_name: front
screw2: 35,275
screw2_name: rear left
screw3: 275,275
screw3_name: rear right
screw4:	275,35


########################################
#  Stepper motors configuration
########################################
# ===================== X-LEFT/E1 IDEX CARRIAGE & EXTRUDER/ #Motor1 ====================
[stepper_x]		
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 64
rotation_distance: 40
#full_steps_per_rotation: 200
endstop_pin: ^!PF4			
position_endstop: -53
position_max: 300
position_min: -55
homing_speed: 20
homing_positive_dir: false

# ===================== X-RIGHT/E2 IDEX CARRIAGE & EXTRUDER/ #Motor5 ====================
# X1 = [stepper_x]; X2 = [dual_carriage] with "axis: x"
[dual_carriage]		
axis: x 
safe_distance: 70
step_pin: PG13
dir_pin: PG12				
enable_pin: !PG15
microsteps: 64
rotation_distance: 40
#full_steps_per_rotation: 200
endstop_pin: ^!PF0				
position_endstop: 359.35
position_min: 0
position_max: 360
homing_speed: 20

# ===================== Y-AXIS CONFIG/ #Motor2 =====================
[stepper_y]		
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 64
rotation_distance: 40
#full_steps_per_rotation: 200
endstop_pin: ^!PF3				
position_endstop: 0
position_min: 0
position_max: 325
homing_speed: 20

# ===================== Z-AXIS CONFIG/ #Motor3 =====================
[stepper_z]		
step_pin: PB8
dir_pin: !PB7				
enable_pin: !PE0
microsteps: 64
rotation_distance: 4
#full_steps_per_rotation: 200
endstop_pin: ^!PF2           
position_max: 350             
position_min: -9.0                        
homing_speed: 5		
second_homing_speed: 3	
homing_retract_speed: 2
homing_retract_dist:5

# ===================== Z1-AXIS CONFIG/ #Motor4 =====================
[stepper_z1]		
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 64
rotation_distance: 4
#full_steps_per_rotation: 200
endstop_pin: ^!PF1 


########################################
# TMC2240 configuration
########################################
[tmc2240 stepper_x]
cs_pin: PC13
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true	
rref: 12000
driver_SLOPE_CONTROL: 2

[tmc2240 dual_carriage]
cs_pin: PG14
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true
rref: 12000
driver_SLOPE_CONTROL: 2

[tmc2240 stepper_y]
cs_pin: PE3
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true	
rref: 12000
driver_SLOPE_CONTROL: 2

[tmc2240 stepper_z]
cs_pin: PB9
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true	
rref: 12000

[tmc2240 stepper_z1]
cs_pin: PB5
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.800
stealthchop_threshold: 999999
interpolate: true
rref: 12000

# ===================== z-tilt for Probe Sensor =====================
#[z_tilt]
# Die echten, physischen Drehpunkte der Z-Spindeln neben dem Bett
#z_positions:
#    -40, 155          # Linke Spindel (ca. 40mm links vom Bett, Y-Mitte)
#    350, 155          # Rechte Spindel (ca. 40mm rechts vom Bett, Y-Mitte)

# Die Punkte auf dem Bett, die der Sensor anfahren soll (jeweils knapp am Rand)
#points:
#    30, 155           # Linker Messpunkt (X=30, Y-Mitte)
#    280, 155          # Rechter Messpunkt (X=280, Y-Mitte)

#speed: 100            # Schnelleres Verfahren zwischen den Punkten spart Zeit
#horizontal_move_z: 6  # 6mm Sicherheitsabstand beim Achsenwechsel
#retries: 5            # 5 Versuche geben Klipper mehr Raum zum perfekten Ausgleichen
#retry_tolerance: 0.02 # Erlaubte Rest-Abweichung (0.02mm ist extrem präzise)

#[safe_z_home]
#home_xy_position: 155, 155  # Exakte Mitte 310x310mm Bett
#speed: 50.0                 # Geschwindigkeit für die X/Y-Anfahrt
#z_hop: 10.0                 # Hebt Z um 10mm AN, BEVOR sich X und Y zum Homen bewegen!
#z_hop_speed: 15.0

[endstop_phase stepper_z]


########################################
# EXTRUDER configuration
########################################
# ===================== HGX lite Extruder/ T0 (EBB42 Gen2) =====================
[extruder]
step_pin: ebb:PD3
dir_pin: ebb:PD2
enable_pin: !ebb:PB6
microsteps: 16
gear_ratio: 9.54647:1
rotation_distance: 52.32
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb:PB0
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: ebb:PA1
#control: pid
#pid_Kp: 34.809
#pid_Ki: 12.893
#pid_Kd: 23.496
min_temp: 0
max_temp: 300
min_extrude_temp: 190

# ===================== HGX lite Extruder/ T1 (EBB42 Gen2) =====================
[extruder1]
step_pin: ebb1:PD3
dir_pin: ebb1:PD2
enable_pin: !ebb1:PB6
microsteps: 16
gear_ratio: 9.54647:1
rotation_distance: 52.32
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb1:PB0
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: ebb1:PA1
#control: pid
#pid_Kp=32.893
#pid_Ki=11.542
#pid_Kd=23.436
min_temp: 0
max_temp: 300
min_extrude_temp: 190


########################################
# Temperatur Sensors
########################################
[temperature_sensor manta]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor raspi]
sensor_type: temperature_host

[temperature_sensor x_motor]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PB0
min_temp: 0
max_temp: 100

[temperature_sensor x1_motor]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC5
min_temp: 0
max_temp: 100


########################################
# FAN configuration
########################################
[temperature_fan stepper_cooling_fan]
pin: PF7                      
sensor_type: ATC Semitec 104GT-2 
sensor_pin: PC4              
control: pid                  
pid_Kp: 40                    
pid_Ki: 0.2
pid_Kd: 20
min_temp: 0
max_temp: 90                  
target_temp: 45.0             
max_speed: 1.0                
min_speed: 0.0                
off_below: 0.10               

[controller_fan stepper_fan]
pin: PA0
max_power: 1.0
idle_timeout: 180
idle_speed: 0.6
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, dual_carriage

# ===================== Part COOLING T0 ====================
[fan_generic berd_air_t0]
pin: !PF8		
cycle_time: 0.0001      
hardware_pwm: False

# ===================== Part COOLING T1 ====================
[fan_generic berd_air_t1]
pin: !PA4
cycle_time: 0.0001
hardware_pwm: False

# ===================== 4 wire Fan ====================
[fan_generic cm4_fan]
pin: PA6        
max_power: 1.0
shutdown_speed: 1.0
cycle_time: 0.00004
hardware_pwm: true
off_below: 0.0
kick_start_time: 0.5
tachometer_pin: PC2     # Der Tacho-Eingangspin am FIL-Port (mit Pull-Up ^ e.G. ^ebb1:PA3)
tachometer_poll_interval: 0.0005
tachometer_ppr: 2
#enable_pin: ebb1:PB4 #   Optional pin to enable power to the fan. This can be useful for fans
#   with dedicated PWM inputs. Some of these fans stay on even at 0% PWM
#   input. In such a case, the PWM pin can be used normally, and e.g. a
#   ground-switched FET(standard fan pin) can be used to control power to
#   the fan.
# Sensor & Temperatur-Steuerung
#sensor_type: temperature_host # Liest die CPU-Temperatur des CM4 aus
#min_temp: 10
#max_temp: 85                # Not-Aus-Schwellenwert zum Schutz des CM4
#target_temp: 50.0           # Zieltemperatur (ab hier regelt der Lüfter hoch)
#max_speed: 0.9
#min_speed: 0.15              # Ermöglicht, dass der Lüfter komplett stoppt
#control: pid                # PID-Regelung für sanfte Drehzahlanpassungen
#pid_kp: 1.0
#pid_ki: 0.5
#pid_kd: 2.0


############################################################
### BOARD PINs
############################################################
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>


############################################################
### Filament Runout and Motion Sensors BTT SFS V2 
############################################################
[filament_switch_sensor switch_sensor_t0]
switch_pin: ^!PD13		
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor_t0]
switch_pin: ^!PD12		
detection_length: 2.88
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted


[filament_switch_sensor switch_sensor_t1]
switch_pin: ^!PC15		
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor_t1]
switch_pin: ^!PA10		
detection_length: 2.88
extruder: extruder1
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted


############################################################
### PSU PIN BIGTREETECH RELAY V1.2
############################################################
[output_pin psu_shutdown]
pin: PD14
value: 1
shutdown_value: 0


############################################################
### LED configuration
############################################################
# ===================== Case LED =====================
[output_pin case_light]
pin: PA5
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.01

# ===================== NeoPixel LED =====================
#[neopixel stripe]
#pin: PD15
#   The pin connected to the neopixel. This parameter must be
#   provided.
#chain_count: 5
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
#color_order: GRBW
#   Set the pixel order required by the LED hardware (using a string
#   containing the letters R, G, B, W with W optional). Alternatively,
#   this may be a comma separated list of pixel orders - one for each
#   LED in the chain. The default is GRB.
#initial_RED: 0.25
#initial_GREEN: 0.25
#initial_BLUE: 0.25
#initial_WHITE: 0.25
#   See the "led" section for information on these parameters.
#[led_effect panel_idle]
#autostart:              true
#frame_rate:             24
#leds:
#    neopixel:panel_ring
#layers:
#    breathing  10 1 top (.5,.5,1)


[include autotune_tmc.cfg]

[include shell_command.cfg]

