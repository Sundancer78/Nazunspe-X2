#   Drivers       : TMC2240
#   Toolheads     : 2x Custom IDEX Toolheads
#   CAN Bus       : 2x BIGTREETECH EBB42 Gen2
#   Motion System : Tenlog TL-D3 Pro mechanical platform
#   Print Bed     : 310 x 310 mm (physical dimensions)
