########################################
#  PRINT_START
########################################
[gcode_macro PRINT_START]
description: Start-Makro für TL-D3 Pro mit BD-Sensor und DC_VARS
gcode:
    CLEAR_PAUSE

    # Modus aus der neuen idex.cfg (DC_VARS) auslesen
    {% set IDEX_MODE = printer["gcode_macro DC_VARS"].mode|default(0)|int %}
    {% set USETOOL = params.USETOOL|default(0)|int %}
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(200)|float %}
    {% set EXTRUDER1 = params.EXTRUDER1_TEMP|default(0)|float %}

    # Beide Hotends während des Bett-Aufheizens auslassen (kein Nachtropfen)
    M104 T0 S0
    M104 T1 S0

    # Heizbett vollständig aufheizen
    M117 Heating Bed...
    M190 S{BED}

    # Bei heißem Bett homen, Z-Tilt ausführen und adaptives Mesh scannen
    M117 Homing & Adaptive Mesh...
    G28
    T0
    Z_TILT_ADJUST
    G28 Z
    BED_MESH_CALIBRATE ADAPTIVE=1
    PARK_extruder

    # Hotends aufheizen (sicher in der Parkposition)
    M117 Heating Extruders...
    {% if IDEX_MODE == 0 %}
        {% if USETOOL == 1 and EXTRUDER1 == 0 %}
            M104 T1 S{EXTRUDER}
            M109 T1 S{EXTRUDER}
        {% else %}
            {% if EXTRUDER > 0 %}
                M104 T0 S{EXTRUDER}
            {% endif %}
            {% if EXTRUDER1 > 0 %}
                M104 T1 S{EXTRUDER1}
            {% endif %}
            {% if EXTRUDER > 0 %}
                M109 T0 S{EXTRUDER}
            {% endif %}
            {% if EXTRUDER1 > 0 %}
                M109 T1 S{EXTRUDER1}
            {% endif %}
        {% endif %}
    {% else %}
        # Copy- oder Mirror-Modus: Beide Köpfe auf gleiche Temperatur heizen
        M104 T0 S{EXTRUDER}
        M104 T1 S{EXTRUDER}
        M109 T0 S{EXTRUDER}
        M109 T1 S{EXTRUDER}
    {% endif %}

    # Koordinaten-Modi setzen
    G90
    M83

    # Gewählten IDEX-Modus scharfschalten
    {% if IDEX_MODE == 1 %}
        ACTIVATE_COPY_MODE
    {% elif IDEX_MODE == 2 %}
        ACTIVATE_MIRROR_MODE
    {% else %}
        T{USETOOL}
    {% endif %}

    M117 Printing...


########################################
#  END_PRINT
########################################
[gcode_macro END_PRINT]
gcode:
    M117 End printing...
    G91
    G1 E-1 F300
    G1 Z+5 E-2 F1000
    G90

    # Heizungen & Lüfter ausschalten
    TURN_OFF_HEATERS
    M107

    # Drucker wieder sauber in den normalen Dual-Modus versetzen & Köpfe parken
    ACTIVATE_DUAL_MODE
	PARK_extruder1
    PARK_extruder
    G1 Y305 F6000

    # Motoren abschalten
    M84
    M117 Print Completed
	PARK_extruder


########################################
#  CANCEL_PRINT
########################################
[gcode_macro CANCEL_PRINT]
description: Bricht den laufenden Druck sauber ab
rename_existing: CANCEL_PRINT_BASE
gcode:
    G91
    G1 Z+5 F1050
    G90
    TURN_OFF_HEATERS
    M107
    ACTIVATE_DUAL_MODE
    G1 Y300 F6000
    CANCEL_PRINT_BASE


########################################
#  PRIME_LINE (Optional)
########################################
[gcode_macro PRIME_LINE]
gcode: 
    {% set x = params.X|default(2)|float %}
    {% set y = params.Y|default(70)|float %}
    {% set z = params.Z|default(0.2)|float %}
    {% set xline = params.XLINE|default(0.8)|float %}
    {% set yline = params.YLINE|default(120)|float %}
    {% set eMultiplier = 0.15 * z %}
    SAVE_GCODE_STATE NAME=_prime_line
    M117 Prime Line
    G90
    M83
    G1 Z0.3 F3000
    G0 Y{y} Z{z}
    G0 X{x}
    G1 Y{y + yline} E{eMultiplier * yline}
    G1 X{x + xline} E{eMultiplier * xline}
    G1 Y{y + 20} E{eMultiplier * (yline - 20)}
    G1 Z0.5 F3000
    RESTORE_GCODE_STATE NAME=_prime_line
