#####################################################################
# 1. ZENTRALE VARIABLEN (Hier deine Werte eintragen!)
#####################################################################
[gcode_macro DC_VARS]
# Physischer Versatz von Extruder 1 (rechts) zu Extruder 0 (links)
variable_offset_x: 0.0
variable_offset_y: 0.0
variable_offset_z: 0.0

# Verfahrgeschwindigkeit beim Parken/Wechseln (in mm/min)
variable_feedrate: 15000

# X-Startposition des zweiten Kopfes im Copy/Mirror-Modus
variable_copy_x: 150.0
variable_mirror_x: 300.0

# Interner Status (0 = Dual-Material, 1 = Copy, 2 = Mirror) -> nicht manuell ändern
variable_mode: 0
gcode:


#####################################################################
# 2. PARK-MAKROS
#####################################################################
[gcode_macro PARK_extruder]
description: Parkt den linken Druckkopf (T0) auf seiner Minimum-Position
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    SAVE_GCODE_STATE NAME=park0
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{printer.configfile.settings.stepper_x.position_min} F{dcvars.feedrate}
    RESTORE_GCODE_STATE NAME=park0

[gcode_macro PARK_extruder1]
description: Parkt den rechten Druckkopf (T1) auf seiner Maximum-Position
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    SAVE_GCODE_STATE NAME=park1
    G90
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{printer.configfile.settings.dual_carriage.position_max} F{dcvars.feedrate}
    RESTORE_GCODE_STATE NAME=park1


#####################################################################
# 3. WERKZEUGWECHSEL (T0 & T1)
#####################################################################
[gcode_macro T0]
description: Aktiviert Extruder 0 (Links)
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% if dcvars.mode == 0 %}
        {% if printer.toolhead.extruder != "extruder" %}
            PARK_extruder1
        {% endif %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

[gcode_macro T1]
description: Aktiviert Extruder 1 (Rechts) mit Offset
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% if dcvars.mode == 0 %}
        {% if printer.toolhead.extruder != "extruder1" %}
            PARK_extruder
        {% endif %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=1
        SET_GCODE_OFFSET X={dcvars.offset_x} Y={dcvars.offset_y} Z={dcvars.offset_z}
    {% endif %}


#####################################################################
# 4. IDEX-MODI (Dual, Copy, Mirror) & M605 Unterstützung
#####################################################################
[gcode_macro ACTIVATE_DUAL_MODE]
description: Normaler IDEX-Modus (Zwei Farben / Zwei Materialien)
gcode:
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=mode VALUE=0
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G28 X
    T0

[gcode_macro ACTIVATE_COPY_MODE]
description: Duplikations-Modus (Beide Köpfe drucken parallel)
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=mode VALUE=1
    G28 X
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X0 F{dcvars.feedrate}
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X{dcvars.copy_x} F{dcvars.feedrate}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY

[gcode_macro ACTIVATE_MIRROR_MODE]
description: Spiegel-Modus (Beide Köpfe drucken gespiegelt)
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=mode VALUE=2
    G28 X
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X0 F{dcvars.feedrate}
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X{dcvars.mirror_x} F{dcvars.feedrate}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR

# Standard-Slicer-Befehl M605 (Cura / PrusaSlicer / OrcaSlicer)
[gcode_macro M605]
description: Schaltet IDEX-Modi per Slicer-Befehl um (S1=Dual, S2=Copy, S3=Mirror)
gcode:
    {% set s = params.S|default(1)|int %}
    {% if s == 1 %}
        ACTIVATE_DUAL_MODE
    {% elif s == 2 %}
        {% if params.X is defined %}
            SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=copy_x VALUE={params.X|float}
        {% endif %}
        ACTIVATE_COPY_MODE
    {% elif s == 3 %}
        ACTIVATE_MIRROR_MODE
    {% endif %}
