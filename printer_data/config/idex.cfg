# NAZUNSPE X2 - IDEX Werkzeugwechsel, Einzelmodus
# Basis: bewährte LNL3dOS-Parkidee, angepasst an die eigenen Achsgrenzen.
# Offset T1 = bisheriger Wert aus der eigenen macros.cfg, noch nicht kalibriert.
# Copy/Mirror erst nach erfolgreichem Einzelmodus separat aktivieren.

[gcode_macro _IDEX_SETTINGS]
variable_t1_x: 3.80
variable_t1_y: 0.50
gcode:
    RESPOND MSG="T1 offset X={printer['gcode_macro _IDEX_SETTINGS'].t1_x} Y={printer['gcode_macro _IDEX_SETTINGS'].t1_y}"

[gcode_macro PARK_extruder]
description: Park T0 on the left; only after homing
gcode:
    {% if 'x' not in printer.toolhead.homed_axes %}
        {action_raise_error('PARK_extruder: X must be homed')}
    {% endif %}
    SAVE_GCODE_STATE NAME=idex_park0
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_GCODE_OFFSET X=0 Y=0
    G90
    G1 X{printer.configfile.settings.stepper_x.position_min} F6000
    RESTORE_GCODE_STATE NAME=idex_park0

[gcode_macro PARK_extruder1]
description: Park T1 on the right; only after homing
gcode:
    {% if 'x' not in printer.toolhead.homed_axes %}
        {action_raise_error('PARK_extruder1: X must be homed')}
    {% endif %}
    SAVE_GCODE_STATE NAME=idex_park1
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_GCODE_OFFSET X=0 Y=0
    G90
    G1 X{printer.configfile.settings.dual_carriage.position_max} F6000
    RESTORE_GCODE_STATE NAME=idex_park1

[gcode_macro T0]
description: Select left tool in single-tool IDEX mode
gcode:
    HOME_IF_NOT
    {% if printer.toolhead.extruder == 'extruder1' %}
        PARK_extruder1
    {% endif %}
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET X=0 Y=0
    RESPOND MSG="T0 selected"

[gcode_macro T1]
description: Select right tool in single-tool IDEX mode
gcode:
    HOME_IF_NOT
    {% if printer.toolhead.extruder == 'extruder' %}
        PARK_extruder
    {% endif %}
    SET_DUAL_CARRIAGE CARRIAGE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_GCODE_OFFSET X={printer['gcode_macro _IDEX_SETTINGS'].t1_x} Y={printer['gcode_macro _IDEX_SETTINGS'].t1_y}
    RESPOND MSG="T1 selected"

[gcode_macro M106]
description: Route slicer part cooling to selected Berd-Air channel
gcode:
    {% set s = params.S|default(255)|float %}
    {% set speed = ([0.0, [s / 255.0, 1.0]|min]|max) %}
    {% if printer.toolhead.extruder == 'extruder1' %}
        SET_FAN_SPEED FAN=berd_air_t1 SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN=berd_air_t0 SPEED={speed}
    {% endif %}

[gcode_macro M107]
gcode:
    SET_FAN_SPEED FAN=berd_air_t0 SPEED=0
    SET_FAN_SPEED FAN=berd_air_t1 SPEED=0
