####################################################
# TMC STEALTH Mode
####################################################
[gcode_macro STEALTH_ON]
description: Aktiviert StealthChop und reduziert Beschleunigung/Tempo
gcode:
    SET_TMC_FIELD STEPPER=stepper_x FIELD=en_pwm_mode VALUE=1
	SET_TMC_FIELD STEPPER=dual_carriage FIELD=en_pwm_mode VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=en_pwm_mode VALUE=1
    SET_TMC_FIELD STEPPER=stepper_z FIELD=en_pwm_mode VALUE=1
	SET_TMC_FIELD STEPPER=stepper_z1 FIELD=en_pwm_mode VALUE=1
    SET_VELOCITY_LIMIT VELOCITY=120 ACCEL=1000 SQUARE_CORNER_VELOCITY=3
    M220 S75

[gcode_macro STEALTH_OFF]
description: Standard-Modus (SpreadCycle und normale Geschwindigkeiten)
gcode:
    SET_TMC_FIELD STEPPER=stepper_x FIELD=en_pwm_mode VALUE=0
	SET_TMC_FIELD STEPPER=dual_carriage FIELD=en_pwm_mode VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=en_pwm_mode VALUE=0
    SET_TMC_FIELD STEPPER=stepper_z FIELD=en_pwm_mode VALUE=0
	SET_TMC_FIELD STEPPER=stepper_z1 FIELD=en_pwm_mode VALUE=0
    SET_VELOCITY_LIMIT VELOCITY=300 ACCEL=3000 SQUARE_CORNER_VELOCITY=5
    M220 S100