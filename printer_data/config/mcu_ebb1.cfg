# This file contains common pin mappings for the BIGTREETECH EBB42
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)" .
# The "EBB42 GEN2" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu ebb1]
canbus_uuid=f720e89d914b

[temperature_sensor ebb1]
sensor_type: Generic 3950
sensor_pin: ebb1:PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: ebb1:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder1]
step_pin: ebb1:PD3
dir_pin: ebb1:PD2
enable_pin: !ebb1:PB6
microsteps: 16
gear_ratio: 9.54647:1
rotation_distance: 54.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb1:PB0
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: ebb1:PA1
control: watermark
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
#min_extrude_temp: 180


[tmc2209 extruder1]
uart_pin: ebb1:PB3
run_current: 0.700
stealthchop_threshold: 999999
diag_pin: ^ebb1:PD1

# ===================== Part COOLING T1 ====================
##[fan_generic berd_air_t1]
# Pumpe für den rechten Druckkopf (T1) an FAN4
#pin: !PD15
#cycle_time: 0.0001
#hardware_pwm: False

# 3w Fan
[heater_fan hotend_fan_extruder1]
pin: ebb1:PA2        # PWM Pin
tachometer_pin: ^ebb1:PB9     # Der Tacho-Eingangspin am FIL-Port (mit Pull-Up ^ e.G. ^ebb1:PA3)
tachometer_poll_interval: 0.0005
tachometer_ppr: 2
enable_pin: ebb1:PB4 #   Optional pin to enable power to the fan. This can be useful for fans
#   with dedicated PWM inputs. Some of these fans stay on even at 0% PWM
#   input. In such a case, the PWM pin can be used normally, and e.g. a
#   ground-switched FET(standard fan pin) can be used to control power to
#   the fan.
max_power: 0.9
shutdown_speed: 0
cycle_time: 0.00004
hardware_pwm: true
kick_start_time: 0.100
off_below: 0.0
heater: extruder1
heater_temp: 50.0
fan_speed: 0.7

#[controller_fan controller_fan_extruder1]
[fan_generic manual_fan ]
pin: ebb1:PB15
#stepper: extruder1 
max_power: 0.9
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0
#idle_timeout: 30

# ===================== Bed Distance Sensor && Mesh =====================
