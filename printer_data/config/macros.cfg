[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE
    M107 ; Schaltet beide Berd-Air Pumpen ab

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1) %}        # Retract-Länge bei Pause
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    M83 ; Filament auf relativen Modus
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{e} F2100
    {% else %}
      RESPOND MSG="Extruder nicht heiss genug fuer Retract"
    {% endif %}
    
    # Nutzt jetzt deinen neuen, blinden Z-Hop inkl. Parken außerhalb des Betts!
    PARK_{printer.toolhead.extruder}

[gcode_macro START_PRINT]
gcode:
	CLEAR_PAUSE
    T0
    home_if_not
    wait_for_temperatures
    prepare_toolheads

[gcode_macro prepare_toolheads]
gcode:
    RESPOND MSG="Preparing the toolheads"
    G90
	G92 E0
	M83
	home_if_not
    # HIER WURDE DER ALTE RESTE-BEFEHL ENTFERNT
	{% if printer.extruder.target|int > 0 %}
	    RESPOND MSG="Preparing T0"
		T0
		SAVE_GCODE_STATE NAME=prime_ext0 
		SET_GCODE_OFFSET X=0 Y=0 Z=0
		G0 X-10 Y35 Z0.5  F9000
		G1 E5 F300
		PRIME_LINE X=3 Y=35 Z=0.2 YLINE=100
		RESTORE_GCODE_STATE NAME=prime_ext0
	{% endif %}
	{% if printer.extruder1.target|int > 0 %}
	    RESPOND MSG="Preparing T1"
		T1
		G0 X225 Y35 Z0.5 F9000
		G1	E5 F300
		PRIME_LINE X=200 Y=35 Z=0.2 YLINE=100
	{% endif %}
	
	{% if printer.toolhead.extruder == "extruder1" %}
		T1
	{% else %}
		T0
	{% endif %}
	M82

[gcode_macro END_PRINT]
gcode:
    M117 End printing.
    G91 
    G1 E-1 F300 
    G1 Z+5 E-2 F1000 
    m104 S0 T0 
    m104 S0 T1 
    M140 S0 
    G90
    T0
    PARK_extruder1
    PARK_extruder
    M106 S255 
    M84 
    # HIER WURDE DER ALTE RESTE-BEFEHL ENTFERNT
    M107 ; Schaltet beide Berd-Air Pumpen ab
    SAVE_IF_SET



[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

################################################################################
################################################################################
[homing_override]
axes: xyz
gcode:
    RESPOND MSG="Zwingendes Abheben vor dem Homing..."
    
    # --- BLINDER FORCE-Z-HOP VOR DEM HOMING ---
    # Wir gaukeln Klipper vor, Z stünde bei 0, damit es sich bewegen darf
    SET_KINEMATIC_POSITION Z=0
    G91                   # Relative Positionierung
    G1 Z5 F600            # Z-Achse fährt IMMER zuerst 5mm hoch (Bett runter)
    G90                   # Absolute Positionierung
    # ------------------------------------------

    # Jetzt führen wir das eigentliche Homing sicher nacheinander aus:
    RESPOND MSG="Homing X-Achse..."
    G28 X                 # Beide Köpfe fahren sicher nach außen
    
    RESPOND MSG="Homing Y-Achse..."
    G28 Y                 # Bett fährt an den Endstopp
    
    RESPOND MSG="Homing Z-Achse..."
    G28 Z                 # Z fährt an die optischen Endschalter
    
    # Optional: Nach dem Homing die Düsen direkt wieder 5mm vom Bett wegholen
    G91
    G1 Z5 F600
    G90
    RESPOND MSG="Homing erfolgreich abgeschlossen."


# Helper script to park the carriage (called from T0 and T1 macros)
[gcode_macro PARK_extruder]
gcode:
    RESPOND MSG="Zwingendes Abheben und Parken links (T0)..."
    
    # --- BLINDER FORCE-Z-HOP ---
    SET_KINEMATIC_POSITION Z=0
    G91                   # Relative Positionierung
    G1 Z5 F600            # Fährt IMMER stur 5mm hoch (Bett runter)
    G90                   # Absolute Positionierung
    # ---------------------------

    SET_DUAL_CARRIAGE CARRIAGE=0
    SAVE_GCODE_STATE NAME=park0
    
    {% set old_offset_x = printer.gcode_move.homing_offsets.x %}
    {% set old_offset_y = printer.gcode_move.homing_offsets.y %}
    SET_GCODE_OFFSET X=0 Y=0

    # Falls X nicht gehomed war, jetzt sicher referenzieren
    {% if not "x" in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}

    # Fahrt zur HGX-Parkposition links
    G1 X{printer.configfile.settings.stepper_x.position_min} F12000

    SET_GCODE_OFFSET X={old_offset_x} Y={old_offset_y}
    RESTORE_GCODE_STATE NAME=park0

[gcode_macro PARK_extruder1]
gcode:
    RESPOND MSG="Zwingendes Abheben und Parken rechts (T1)..."
    
    # --- BLINDER FORCE-Z-HOP ---
    SET_KINEMATIC_POSITION Z=0
    G91
    G1 Z5 F600
    G90
    # ---------------------------

    SET_DUAL_CARRIAGE CARRIAGE=1
    SAVE_GCODE_STATE NAME=park1
    
    {% set old_offset_x = printer.gcode_move.homing_offsets.x %}
    {% set old_offset_y = printer.gcode_move.homing_offsets.y %}
    SET_GCODE_OFFSET X=0 Y=0

    {% if not "x" in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}

    # Fahrt zur HGX-Parkposition rechts
    G1 X{printer.configfile.settings.dual_carriage.position_max} F12000

    SET_GCODE_OFFSET X={old_offset_x} Y={old_offset_y}
    RESTORE_GCODE_STATE NAME=park1
	

# Activate the primary extruder
[gcode_macro T0]
gcode:
    RESPOND MSG="Selecting tool T0"
    home_if_not
    {% if printer.toolhead.extruder != "extruder" %}
        PARK_{printer.toolhead.extruder}
    {% endif %}
    
    # --- IDEX PUMPEN-UMSCHALTUNG ---
    {% set speed = printer["fan_generic berd_air_t1"].speed %}
    SET_FAN_SPEED FAN=berd_air_t1 SPEED=0
    SET_FAN_SPEED FAN=berd_air_t0 SPEED={speed}
    # -------------------------------

    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0
    
    # T0 ist deine mechanische Basis – hier wird das Offset immer absolut genullt
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1

[gcode_macro T1]
gcode:
    RESPOND MSG="Selecting tool T1"
    home_if_not
    {% if printer.toolhead.extruder != "extruder1" %}
        PARK_{printer.toolhead.extruder}
    {% endif %}

    # --- IDEX PUMPEN-UMSCHALTUNG ---
    {% set speed = printer["fan_generic berd_air_t0"].speed %}
    SET_FAN_SPEED FAN=berd_air_t0 SPEED=0
    SET_FAN_SPEED FAN=berd_air_t1 SPEED={speed}
    # -------------------------------

    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_DUAL_CARRIAGE CARRIAGE=1
    
    # --- HIER DEINE OFFSET-WERTE EINTRAGEN ---
    # Wenn T1 z.B. 0.2mm weiter rechts druckt als T0, ziehst du das hier ab (X=-0.2)
    # Wenn T1 in Z etwas höher/tiefer hängt, kannst du das hier ebenfalls ausgleichen!
    SET_GCODE_OFFSET X=0.00 Y=0.00 Z=0.00 MOVE=1

[gcode_macro M106]
gcode:
    {% set raw_speed = params.S|default(255)|float %}
    {% set speed = raw_speed / 255.0 %}
    
    {% if printer.toolhead.extruder == "extruder" %}
        SET_FAN_SPEED FAN=berd_air_t0 SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN=berd_air_t1 SPEED={speed}
    {% endif %}

[gcode_macro M107]
gcode:
    SET_FAN_SPEED FAN=berd_air_t0 SPEED=0
    SET_FAN_SPEED FAN=berd_air_t1 SPEED=0


[gcode_macro home_if_not ]
gcode:
	{% if printer.toolhead.homed_axes != 'xyz' %}
	  G28
    {% endif %}

[gcode_macro PRIME_LINE]
gcode: 
    RESPOND MSG="Printing a priming line "
    {% set x = params.X|default(2)|float %}
    {% set y = params.Y|default(70)|float %}
	{% set z = params.Z|default(0.2)|float %}
    {% set xline = params.XLINE|default(0.8)|float %}
    {% set yline = params.YLINE|default(120)|float %}
	{% set eMultiplier = 0.15 * z  %}
    SAVE_GCODE_STATE NAME=prime_line
 	M117 Prime Line
    G90 
	M83 
    G1 Z0.3 F3000 
	G0 Y{y} Z{z}
    G0 X{x} 
	G1 Y{y + yline} E{eMultiplier * yline} 
    G1 X{x + xline} E{eMultiplier * xline} 
    G1 Y{y + 20} E{eMultiplier * (yline - 20)} 
    G1 Z0.5 F3000 
	RESTORE_GCODE_STATE NAME=prime_line



[gcode_macro wait_for_temperatures]
gcode:
    M190 S{printer.heater_bed.target}
    M109 T0 S{printer.extruder.target}
	M109 T1 S{printer.extruder1.target}
    

[gcode_macro SEARCH_VARS]
gcode:
    {% set search = params.S|lower %}
    {% set ns = namespace() %}
    {% for item in printer  %}
        {% if ' ' in item %}
            {% set ns.path = ['printer', "['%s']" % (item), ''] %}
        {% else %}
            {% set ns.path = ['printer.', item, ''] %}   
        {% endif %} 

        {% if search in ns.path|lower %}
            { action_respond_info(ns.path|join) }
        {% endif %} 

        {% if printer[item].items() %}
            {% for childkey, child in printer[item].items() recursive %}
                {% set ns.path = ns.path[:loop.depth|int + 1] %}

                {% if ' ' in childkey %}
                    {% set null = ns.path.append("['%s']" % (childkey)) %}
                {% else %}
                    {% set null = ns.path.append(".%s" % (childkey)) %}
                {% endif %} 

                {% if child is mapping  %}
                    { loop(child.items()) }
                {% else %}
                    {% if search in ns.path|lower %}
                        { action_respond_info("%s : %s" % (ns.path|join, child)) }   
                    {% endif %} 
                {% endif %} 
                
            {% endfor %}
        {% endif %} 
    {% endfor %}
    
[gcode_macro SAVE_AT_END]
variable_save: 1
gcode:
  SET_GCODE_VARIABLE MACRO=SAVE_AT_END VARIABLE=save VALUE=1
  
[gcode_macro SAVE_IF_SET]
gcode:
  {% if printer["gcode_macro SAVE_AT_END"].save == 1 %}
    SAVE_CONFIG
  {% endif %}

[gcode_macro INITIALIZE_VARIABLE]
gcode:
  {% if 'VARIABLE' not in params %}
    {action_respond_info("Missing VARIABLE parameter")}
  {% elif 'VALUE' not in params %}
    {action_respond_info("Missing VALUE parameter")}
  {% else %}
    {% set svv = printer.save_variables.variables %}
    {% if params.VARIABLE not in svv %}
      {% set escaped = params.VALUE|replace("\"", "\\\"") %}
      SAVE_VARIABLE VARIABLE={params.VARIABLE} VALUE="{escaped}"
    {% endif %}
  {% endif %}

[gcode_macro ACTIVATE_COPY_MODE]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X100
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

[gcode_macro ACTIVATE_MIRROR_MODE]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X200
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

[gcode_macro WIPE_LINE]
gcode:
  {% set z = params.Z|default(0.25)|float %}
  {% set n = params.N|default(0.4)|float %}

  {% if printer.toolhead.homed_axes != "xyz" %}
    G28 ; Home all axes if not ready
  {% endif %}

  {% if printer.extruder.temperature < 170 %}
    {action_respond_info("Extruder temperature too low")}
  {% else %}
    SAVE_GCODE_STATE NAME=WIPE_LINE_state
    M82
    G90
    G92 E0
    G1 X10 Y20 Z5 F3000
    G1 Z{z} F3000
    G1 X10 Y150 F1500 E10.83
    G1 X{ n + 10.0 } F5000
    G1 Y22 F1500 E21.5
    G1 Y20 F5000
    RESTORE_GCODE_STATE NAME=WIPE_LINE_state MOVE=0
  {% endif %}
  
[gcode_macro PREP_PRINT]
description: Loads and starts the print
variable_x_max: 0
variable_y_max: 0
variable_z_max: 0
variable_nozzle: 0
variable_fila_dia: 0
variable_bed_temp: 0
variable_extruder_temp: 0
variable_chamber_temp: 0
variable_layer_count: 0
variable_tool_changes: 0
variable_cur_layer: 0
variable_num_layers: 0
variable_layer_z: 0

gcode:

  M117 Print intializing...

  #Get Printer built volume dimensions
  {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}
  {% set Z_MAX = printer.toolhead.axis_maximum.z|default(100)|float %}

  #Get Nozzle diameter and filament width for conditioning
  {% set NOZZLE = printer.extruder.nozzle_diameter|default(0.4)|float %}
  {% set FILADIA = printer.extruder.filament_diameter|default(1.75)|float %}

  #Set Start coordinates of priming lines
  {% set X_START = 10.0|default(10.0)|float %}
  {% set Y_START = 20.0|default(20.0)|float %}

  #Calculate Primer line extrusion volume and filament length
  {% set PRIMER_WIDTH = 0.75 * NOZZLE %}                    
  {% set PRIMER_HEIGHT = 0.70 * NOZZLE %}           
  {% set PRIMER_SECT = PRIMER_WIDTH * PRIMER_HEIGHT %}    
  {% set PRIMER_VOL = PRIMER_SECT * (X_MAX - 3 * X_START) %}    
  {% set FILA_SECT = 3.1415 * ( FILADIA / 2.0)**2 %}          
  {% set FILA_LENGTH = 1.55 * PRIMER_VOL / FILA_SECT %}
  {% set FILAMENT_TYPE = params.FILAMENT|default(PLA)|string %}

  #Get Bed, Extruder, and Chamber temperatures from Slicer GCode
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER|default(50)|float %}

  # Get Number of Layers
  {% set NUM_LAYERS = params.COUNT|default(0)|float %}
  {% set CUR_LAYER = params.NUM|default(0)|float + 1 %}

  # Get Number of Tool Changes Required
  {% set TOOL_CHANGES = params.TOOLS|default(0)|float %}

  # Save print configuration specs for later use
  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=x_max VALUE={X_MAX}
  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=y_max VALUE={Y_MAX}
  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=z_max VALUE={Z_MAX}

  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=nozzle VALUE={NOZZLE}
  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=fila_dia VALUE={FILADIA}

  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=bed_temp VALUE={BED_TEMP}
  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=extruder_temp VALUE={EXTRUDER_TEMP}
  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=chamber_temp VALUE={CHAMBER_TEMP}

  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=cur_layer VALUE={CUR_LAYER}
  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=num_layers VALUE={NUM_LAYERS}

  SET_GCODE_VARIABLE MACRO=PREP_PRINT VARIABLE=tool_changes VALUE={TOOL_CHANGES}

  # Turn on the lights!
  # I don't have any lights yet... sounds fun though!
  #WLED_ON PRESET=1

  # Make sure T0 is selected for Z probing
  T0

  # Begin preheating and prepping for print
  G90 ; use absolute coordinates
  M83 ; extruder relative mode

  M117 Preheating bed for homing...

  M104 S{EXTRUDER_TEMP}
  G4 S10 ; allow partial nozzle warmup
  M190 S{BED_TEMP} ; set final bed temp
  M117 Homing all axis...
  G28 ; home all axis

  M117 Waiting for temperatures to stabilize...

  M104 S{EXTRUDER_TEMP} ; set final nozzle temp
  G28 X ; park extruders while warming up for wipe
  M190 S{BED_TEMP} ; wait for bed temp to stabilize
  M109 S{EXTRUDER_TEMP} ; wait for nozzle temp to stabilize

  G28 ; Absichern, dass alle Achsen nach dem Parken referenziert sind

  WIPE_LINE

  M117 Print Started

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description:
gcode:
    #run z tilt with z move up and down at first
    BDSENSOR_SET QGL_TILT_PROBE=1 #set this 1 to enable z axis up and down
    BDSENSOR_SET COLLISION_HOMING=0
    _Z_TILT_ADJUST horizontal_move_z=6 retry_tolerance=1
    G28 Z0
    #run z tilt with no z move up and down
    BDSENSOR_SET QGL_TILT_PROBE=0 #set this 0 to disable z axis up and down while probe
    _Z_TILT_ADJUST horizontal_move_z=1 retry_tolerance=0.04
    #BDSENSOR_SET COLLISION_HOMING=1 #optional
    G28 Z0

