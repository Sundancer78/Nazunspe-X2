# IDEX MANUAL CARRIAGE SELECTION - COMMISSIONING / TEST
# ============================================================

[gcode_macro SELECT_X1]
description: Select left X carriage without homing or tool change
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0

[gcode_macro SELECT_X2]
description: Select right X carriage without homing or tool change
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1

