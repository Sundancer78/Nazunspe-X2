# NAZUNSPE X2 - bewusst schlanke allgemeine Makros
# T0/T1 in idex.cfg, Druckablauf in print_start_end.cfg
# PAUSE / RESUME / CANCEL_PRINT kommen ausschliesslich aus mainsail.cfg.
####################################################
#	Macros   ************   NAZUNSPE X2   ************
####################################################
[include NAZUNSPEVariables.cfg]
[include NAZUNSPE_Init.cfg]
[include idex.cfg]
[include testspeed.cfg]
[include LoadUnloadFilament.cfg]
[include PrintStartEnd.cfg]



###############################################################
# PRINT START AND END   ************   NAZUNSPE X2   ************
###############################################################
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    {% set t = params.T|default(0)|int %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}

    {% if s != 0 %}
        {% if t == 1 %}
            TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={s} MAXIMUM={s+1}
        {% else %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
        {% endif %}
    {% endif %}

##############################################################
# HOMING AND PARKING   ************   NAZUNSPE X2   ************
##############################################################
# home unit if not already, if homed will not move any axis
[gcode_macro HOME_IF_NOT]
gcode:
	{% if printer.toolhead.homed_axes != 'xyz' %}
	  G28
  {% endif %}


[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
gcode:
    {% if 'z' in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=PAUSE_PARK_STATE
        G91
        G0 Z{[25.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min|float} F600
        RESTORE_GCODE_STATE NAME=PAUSE_PARK_STATE
    {% else %}
        RESPOND TYPE=echo MSG="Pause: Z not homed, skipping Z lift"
    {% endif %}


###########################################################
# GENERAL UTILITY   ************   NAZUNSPE X2   ************
###########################################################

### ------------------------------ ###
#moves toolhead to a maintenance position
#todo: improve overall, allow input of specific extruder
[gcode_macro _MAKE_EXTRUDER_ACCESSIBLE]
gcode:
  G28
  G91
  G1 Z+100 F1000
  T0
  G1 X+150 F1750
  #T1
  #G1 X-150 F1750
  G90


[gcode_macro M601]
description: Call Pause if M601 gcode is used 
gcode:
  PAUSE


###################################################################################
# BERD AIR - AUTOMATISCHE BAUTEILKUEHLUNG   ************   NAZUNSPE X2   ************
###################################################################################
[gcode_macro M106]
description: Berd Air cooling for active IDEX tool
gcode:
    {% set speed = [[params.S|default(255)|float / 255.0, 0.0]|max, 1.0]|min %}
    {% set mode = printer["gcode_macro _IDEX_MODE"].idex_mode|int %}
    {% set tool = printer.toolhead.extruder %}

    {% if mode in [1, 2] %}
        SET_FAN_SPEED FAN=berd_air_t0 SPEED={speed}
        SET_FAN_SPEED FAN=berd_air_t1 SPEED={speed}
    {% elif tool == "extruder1" %}
        SET_FAN_SPEED FAN=berd_air_t0 SPEED=0
        SET_FAN_SPEED FAN=berd_air_t1 SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN=berd_air_t1 SPEED=0
        SET_FAN_SPEED FAN=berd_air_t0 SPEED={speed}
    {% endif %}


[gcode_macro M107]
description: Switch off both Berd Air pumps
gcode:
    SET_FAN_SPEED FAN=berd_air_t0 SPEED=0
    SET_FAN_SPEED FAN=berd_air_t1 SPEED=0