[gcode_macro CARRIAGE_LEFT]
description: Activate left X carriage
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0

[gcode_macro CARRIAGE_RIGHT]
description: Activate right X carriage
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1

