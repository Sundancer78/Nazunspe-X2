# This file contains common pin mappings for the BIGTREETECH EBB42
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)" .
# The "EBB42 GEN2" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu ebb]
canbus_uuid=dceb3317ae34

[temperature_sensor ebb]
sensor_type: Generic 3950
sensor_pin: ebb:PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: ebb:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

#[extruder]
#step_pin: ebb:PD3
#dir_pin: ebb:PD2
#enable_pin: !ebb:PB6
#microsteps: 16
#gear_ratio: 9.54647:1
#rotation_distance: 54.5
#nozzle_diameter: 0.400
#filament_diameter: 1.750
#heater_pin: ebb:PB0
#sensor_type: EPCOS 100K B57560G104F
#pullup_resistor: 2200
#sensor_pin: ebb:PA1
#control: pid
#pid_Kp: 34.809
#pid_Ki: 12.893
#pid_Kd: 23.496
#min_temp: 0
#max_temp: 300
#min_extrude_temp: 180

[tmc2209 extruder]
uart_pin: ebb:PB3
run_current: 0.700
stealthchop_threshold: 999999
diag_pin: ^ebb:PD1

# ===================== Part COOLING T0 ====================
##[fan_generic berd_air_t0]
# Pumpe für den linken Druckkopf (T0) an FAN3
##pin: !PD14
##cycle_time: 0.0001            # 10kHz Steuerfrequenz (ideal für kraftvolle Pumpenmotoren)
##hardware_pwm: False





#[heater_fan hotend_fan]
#pin: ebb:PB8
#heater: extruder1
#heater_temp: 50.0

# 3w Fan2
[heater_fan hotend_fan_extruder]
pin: ebb:PA2        # PWM Pin
tachometer_pin: ebb:PB9     # Der Tacho-Eingangspin am FIL-Port (mit Pull-Up ^)
tachometer_poll_interval: 0.0005
tachometer_ppr: 2
enable_pin: ebb:PB4 #   Optional pin to enable power to the fan. This can be useful for fans
#   with dedicated PWM inputs. Some of these fans stay on even at 0% PWM
#   input. In such a case, the PWM pin can be used normally, and e.g. a
#   ground-switched FET(standard fan pin) can be used to control power to
#   the fan.
max_power: 0.9
shutdown_speed: 0
cycle_time: 0.00004
hardware_pwm: true
kick_start_time: 0.100
off_below: 0.0
heater: extruder
heater_temp: 50.0
fan_speed: 0.7

#[heater_fan 3w_fan2]
#pin: ebb:PB4
#tachometer_pin: ebb:PB9

[controller_fan controller_fan_extruder]
pin: ebb:PB8
stepper: 
max_power: 0.9
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.500
off_below: 0.0
idle_timeout: 30

